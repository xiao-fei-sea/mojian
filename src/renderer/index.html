<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" />
  <title>墨笺</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ══════════ 标题栏 ══════════ -->
<header class="titlebar">
  <div class="tb-left">
    <img class="app-logo" src="../assets/icon.png" alt="墨笺" />
    <span class="doc-title" id="docTitle">墨笺</span>
    <span class="dirty-dot" id="dirtyDot" title="有未保存的更改"></span>
  </div>
  <div class="tb-right">
    <button class="win-btn" id="btnMin" title="最小化">
      <svg viewBox="0 0 16 16" width="12" height="12"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
    <button class="win-btn" id="btnMax" title="最大化">
      <svg viewBox="0 0 16 16" width="12" height="12"><rect x="3.6" y="3.6" width="8.8" height="8.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="win-btn win-close" id="btnClose" title="关闭">
      <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<!-- ══════════ 工具栏 ══════════ -->
<div class="toolbar">
  <div class="tool-group" data-tour="file">
    <button class="tool-btn" data-action="new" title="新建　Ctrl+N">
      <svg viewBox="0 0 16 16"><path d="M9.2 1.9H3.9A1.3 1.3 0 0 0 2.6 3.2v9.6a1.3 1.3 0 0 0 1.3 1.3h8.2a1.3 1.3 0 0 0 1.3-1.3V6.3z"/><path d="M9.2 1.9v4.4h4.2"/></svg>
      <span class="tool-label">新建</span>
    </button>
    <button class="tool-btn" data-action="open" title="打开　Ctrl+O">
      <svg viewBox="0 0 16 16"><path d="M2.3 12.9V4.3a1.2 1.2 0 0 1 1.2-1.2h2.7l1.3 1.7h4.9a1.2 1.2 0 0 1 1.2 1.2v1"/><path d="M2.3 12.9l1.7-4.7h11l-1.8 4.7z"/></svg>
      <span class="tool-label">打开</span>
    </button>
    <button class="tool-btn" data-action="save" title="保存　Ctrl+S">
      <svg viewBox="0 0 16 16"><path d="M8 2.2v7"/><path d="M5.3 6.5 8 9.2l2.7-2.7"/><path d="M3 12.1v1.1c0 .6.5 1.1 1.1 1.1h7.8c.6 0 1.1-.5 1.1-1.1v-1.1"/></svg>
      <span class="tool-label">保存</span>
    </button>
  </div>

  <div class="tool-sep"></div>

  <div class="tool-group" data-tour="format">
    <button class="tool-btn" data-action="bold" title="加粗　Ctrl+B">
      <span class="tool-glyph" style="font-weight:800">B</span>
      <span class="tool-label">加粗</span>
    </button>
    <button class="tool-btn" data-action="italic" title="斜体　Ctrl+I">
      <span class="tool-glyph" style="font-style:italic;font-family:Georgia,serif">I</span>
      <span class="tool-label">斜体</span>
    </button>
    <div class="tool-dropwrap">
      <button class="tool-btn" data-action="heading-menu" title="标题">
        <span class="tool-glyph">H<span class="caret"></span></span>
        <span class="tool-label">标题</span>
      </button>
    </div>
    <button class="tool-btn" data-action="quote" title="引用　Ctrl+Shift+Q">
      <svg viewBox="0 0 16 16"><rect x="2.6" y="3.2" width="10.8" height="9.6" rx="1.6"/><path d="M5.4 5.8v4.4"/></svg>
      <span class="tool-label">引用</span>
    </button>
    <button class="tool-btn" data-action="codeblock" title="代码块　Ctrl+Shift+C">
      <svg viewBox="0 0 16 16"><path d="M6.3 5.1 3.2 8l3.1 2.9"/><path d="M9.7 5.1 12.8 8l-3.1 2.9"/></svg>
      <span class="tool-label">代码</span>
    </button>
    <button class="tool-btn" data-action="link" title="链接　Ctrl+K">
      <svg viewBox="0 0 16 16"><path d="M6.7 9.3a2.6 2.6 0 0 0 3.7 0l2-2a2.6 2.6 0 0 0-3.7-3.7l-1 1"/><path d="M9.3 6.7a2.6 2.6 0 0 0-3.7 0l-2 2a2.6 2.6 0 0 0 3.7 3.7l1-1"/></svg>
      <span class="tool-label">链接</span>
    </button>
    <button class="tool-btn" data-action="image" title="插入图片（也支持粘贴、拖入）">
      <svg viewBox="0 0 16 16"><rect x="2.4" y="3.3" width="11.2" height="9.4" rx="1.5"/><circle cx="5.9" cy="6.4" r="1.05"/><path d="M2.7 10.6 6 7.6l2.4 2.1 1.9-1.6 3 2.5"/></svg>
      <span class="tool-label">图片</span>
    </button>
    <div class="tool-dropwrap">
      <button class="tool-btn" data-action="list-menu" title="列表">
        <svg viewBox="0 0 16 16"><path d="M6.4 4.4h7M6.4 8h7M6.4 11.6h7"/><circle cx="3.5" cy="4.4" r=".95"/><circle cx="3.5" cy="8" r=".95"/><circle cx="3.5" cy="11.6" r=".95"/></svg>
        <span class="tool-label">列表</span>
      </button>
    </div>
    <button class="tool-btn" data-action="table" title="表格">
      <svg viewBox="0 0 16 16"><rect x="2.5" y="3.4" width="11" height="9.2" rx="1.4"/><path d="M2.5 8h11M8 3.4v9.2"/></svg>
      <span class="tool-label">表格</span>
    </button>
    <button class="tool-btn" data-action="hr" title="分割线">
      <svg viewBox="0 0 16 16"><path d="M2.6 8h10.8" stroke-width="1.6"/></svg>
      <span class="tool-label">分割线</span>
    </button>
  </div>

  <div class="tool-spacer"></div>

  <div class="tool-group">
    <div class="segmented" id="modeSwitch">
      <button data-mode="split" title="分栏模式　Ctrl+\">
        <svg viewBox="0 0 16 16"><rect x="2.3" y="3.3" width="11.4" height="9.4" rx="1.5"/><path d="M8 3.3v9.4"/></svg>
        <span>分栏</span>
      </button>
      <button data-mode="wysiwyg" title="单栏模式　Ctrl+\">
        <svg viewBox="0 0 16 16"><rect x="2.3" y="3.3" width="11.4" height="9.4" rx="1.5"/><path d="M5.6 6.1h4.8M5.6 8.2h4.8M5.6 10.3h3.2"/></svg>
        <span>单栏</span>
      </button>
      <button data-mode="preview" title="纯预览　Ctrl+Shift+P">
        <svg viewBox="0 0 16 16"><path d="M1.9 8S4.1 4.4 8 4.4 14.1 8 14.1 8 11.9 11.6 8 11.6 1.9 8 1.9 8z"/><circle cx="8" cy="8" r="1.9"/></svg>
        <span>预览</span>
      </button>
    </div>

    <button class="tool-btn" data-action="theme" title="切换主题　Ctrl+Shift+D">
      <svg viewBox="0 0 16 16" class="icon-moon"><path d="M13.5 9.7A5.7 5.7 0 0 1 6.3 2.5a5.7 5.7 0 1 0 7.2 7.2z"/></svg>
      <svg viewBox="0 0 16 16" class="icon-sun"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.7v1.5M8 12.8v1.5M1.7 8h1.5M12.8 8h1.5M3.6 3.6l1 1M11.4 11.4l1 1M12.4 3.6l-1 1M4.6 11.4l-1 1"/></svg>
      <span class="tool-label">主题</span>
    </button>

    <button class="tool-btn" data-action="find" title="查找　Ctrl+F">
      <svg viewBox="0 0 16 16"><circle cx="7.2" cy="7.2" r="4.3"/><path d="M10.4 10.4 13.6 13.6"/></svg>
      <span class="tool-label">查找</span>
    </button>

    <button class="tool-btn" data-action="pin" title="钉住窗口（像微信的图钉一样，让窗口一直留在最前面）">
      <svg viewBox="0 0 16 16"><path d="M5.6 3.4h4.8"/><path d="M6.8 3.4v3.5L5.4 8.6h5.2L9.2 6.9V3.4"/><path d="M8 8.6v4.1"/></svg>
      <span class="tool-label">钉住</span>
    </button>

    <button class="tool-btn" data-action="menu" title="更多">
      <svg viewBox="0 0 16 16" class="icon-fill"><circle cx="8" cy="3.3" r="1.15"/><circle cx="8" cy="8" r="1.15"/><circle cx="8" cy="12.7" r="1.15"/></svg>
      <span class="tool-label">更多</span>
    </button>
  </div>
</div>

<!-- ══════════ 文档标签栏 ══════════ -->
<div class="tabbar">
  <div class="tabs" id="tabs" role="tablist"></div>
  <button class="tab-add" id="tabAdd" title="新建文档　Ctrl+N">
    <svg viewBox="0 0 16 16"><path d="M8 3.4v9.2"/><path d="M3.4 8h9.2"/></svg>
  </button>
</div>

<!-- ══════════ 工作区 ══════════ -->
<div class="workspace" id="workspace" data-mode="split">
  <section class="pane pane-source">
    <textarea id="editor" spellcheck="false" placeholder="Markdown 源码…"></textarea>
  </section>

  <div class="splitter" id="splitter" title="拖动调整宽度"></div>

  <section class="pane pane-preview">
    <div class="scroll" id="previewScroll">
      <article class="markdown-body" id="preview" data-placeholder="直接在这里输入…像记事本一样"></article>
    </div>
  </section>

  <!-- 没有任何文档时的引导 -->
  <div class="empty-state" id="emptyState" hidden>
    <svg class="es-icon" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M12 6h16l10 10v26a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/>
      <path d="M28 6v10h10"/>
      <path d="M17 27h14M17 34h9"/>
    </svg>
    <h2>还没有打开的文档</h2>
    <p>新建一个空白文档，或打开本地已有的 Markdown 文件。</p>
    <div class="es-actions">
      <button class="es-btn primary" id="esNew">新建文档</button>
      <button class="es-btn" id="esOpen">打开文件</button>
    </div>
    <span class="es-hint">也可以把 .md 文件直接拖进窗口</span>
  </div>
</div>

<!-- ══════════ 状态栏 ══════════ -->
<footer class="statusbar">
  <div class="sb-left">
    <span id="sbPos">行 1，列 1</span>
    <span class="sb-sep"></span>
    <span id="sbSel"></span>
  </div>
  <div class="sb-right">
    <span id="sbWords">0 字</span>
    <span class="sb-sep"></span>
    <span id="sbChars">0 字符</span>
    <span class="sb-sep"></span>
    <span id="sbSave">未保存</span>
    <span class="sb-sep"></span>
    <span>UTF-8</span>
    <span class="sb-sep"></span>
    <span>Markdown</span>
  </div>
</footer>

<!-- ══════════ 查找条 ══════════ -->
<div class="findbar" id="findbar" hidden>
  <div class="find-row">
    <svg class="find-icon" viewBox="0 0 16 16"><circle cx="7.2" cy="7.2" r="4.3"/><path d="M10.4 10.4 13.6 13.6"/></svg>
    <input id="findInput" type="text" placeholder="查找…" spellcheck="false" />
    <span class="find-count" id="findCount">0/0</span>
    <button class="find-btn" id="findPrev" title="上一个　Shift+Enter">
      <svg viewBox="0 0 16 16"><path d="M8 12.4V3.8"/><path d="M4.6 7.2 8 3.8l3.4 3.4"/></svg>
    </button>
    <button class="find-btn" id="findNext" title="下一个　Enter">
      <svg viewBox="0 0 16 16"><path d="M8 3.6v8.6"/><path d="M11.4 8.8 8 12.2 4.6 8.8"/></svg>
    </button>
    <button class="find-btn" id="findClose" title="关闭　Esc">
      <svg viewBox="0 0 16 16"><path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2"/></svg>
    </button>
  </div>
  <div class="find-row find-replace">
    <input id="replaceInput" type="text" placeholder="替换为…" spellcheck="false" />
    <button class="find-btn wide" id="replaceOne">替换</button>
    <button class="find-btn wide" id="replaceAll">全部替换</button>
    <button class="find-btn" id="toggleReplace" title="展开/收起替换">
      <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
    </button>
  </div>
</div>

<!-- ══════════ 表格浮动工具条 ══════════ -->
<div class="table-bar" id="tableBar" hidden>
  <button class="table-bar-btn" data-table="addRow" title="在下方插入一行">+ 行</button>
  <button class="table-bar-btn" data-table="delRow" title="删除当前行">− 行</button>
  <button class="table-bar-btn" data-table="addCol" title="在右侧插入一列">+ 列</button>
  <button class="table-bar-btn" data-table="delCol" title="删除当前列">− 列</button>
</div>
<!-- ══════════ 弹出菜单 ══════════ -->
<div class="popup" id="popup" hidden></div>

<!-- ══════════ 模态框 ══════════ -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modalBox"></div>
</div>

<!-- ══════════ 新手引导 ══════════ -->
<div class="tour" id="tour" hidden>
  <div class="tour-dim" id="tourDim"></div>
  <div class="tour-spot" id="tourSpot"></div>
  <div class="tour-card">
    <div class="tour-step" id="tourStep"></div>
    <h3 id="tourTitle"></h3>
    <p id="tourBody"></p>
    <div class="tour-actions">
      <button class="tour-skip" id="tourSkip">跳过引导</button>
      <span class="tour-grow"></span>
      <button class="tour-nav" id="tourPrev">上一步</button>
      <button class="tour-nav primary" id="tourNext">下一步</button>
    </div>
  </div>
</div>

<!-- ══════════ 拖放提示 ══════════ -->
<div class="drop-overlay" id="dropOverlay" hidden>
  <div class="drop-card">
    <svg viewBox="0 0 24 24" width="34" height="34"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <p>松手即可打开 Markdown 文件，或把图片插入文档</p>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="app.js"></script>
</body>
</html>
